<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex FIFA - Prédictions Professionnelles</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav id="navbar">
            <div class="nav-brand">
                <span class="brand-icon">⚽</span>
                <span class="brand-name">Apex FIFA</span>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="#" class="nav-link active" data-page="home">Accueil</a>
                <a href="#" class="nav-link" data-page="predictions">Prédictions</a>
                <a href="#" class="nav-link" data-page="subscription">Abonnement</a>
                <a href="#" class="nav-link" data-page="profile">Compte</a>
                <a href="#" class="nav-link" data-page="admin" id="adminLink" style="display:none;">Admin</a>
            </div>
            <div class="nav-actions">
                <button id="whatsappBtn" class="whatsapp-btn" onclick="openWhatsApp()">💬 Support</button>
                <button id="logoutBtn" class="logout-btn" onclick="logout()">Déconnexion</button>
            </div>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
        </nav>

        <!-- Main Content -->
        <main id="mainContent">
            <div id="page-home" class="page active"></div>
            <div id="page-predictions" class="page"></div>
            <div id="page-subscription" class="page"></div>
            <div id="page-profile" class="page"></div>
            <div id="page-admin" class="page"></div>
        </main>

        <!-- Bottom Navigation (Mobile) -->
        <nav id="bottomNav">
            <button class="bottom-nav-btn active" data-page="home">
                <span class="icon">🏠</span>
                <span class="label">Accueil</span>
            </button>
            <button class="bottom-nav-btn" data-page="predictions">
                <span class="icon">📊</span>
                <span class="label">Prédictions</span>
            </button>
            <button class="bottom-nav-btn" data-page="subscription">
                <span class="icon">💎</span>
                <span class="label">Abonnement</span>
            </button>
            <button class="bottom-nav-btn" data-page="profile">
                <span class="icon">👤</span>
                <span class="label">Compte</span>
            </button>
        </nav>

        <!-- WhatsApp Floating Button -->
        <button id="whatsappFloat" class="whatsapp-float" onclick="openWhatsApp()">💬</button>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="authTitle">Connexion</h2>
                <button class="modal-close" onclick="closeAuthModal()">✕</button>
            </div>
            <div id="authForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="authPassword" placeholder="••••••••">
                </div>
                <div id="confirmPasswordGroup" class="form-group" style="display:none;">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" id="authConfirmPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Code d'appareil</label>
                    <input type="text" id="authDeviceCode" readonly>
                </div>
                <button id="authSubmitBtn" class="btn-primary" onclick="handleAuth()">Se connecter</button>
                <p class="auth-switch">
                    <span id="authSwitchText">Pas encore de compte ?</span>
                    <a href="#" id="authSwitchLink" onclick="switchAuthMode()">S'inscrire</a>
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
